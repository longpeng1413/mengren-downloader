name: Windows portable build
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check developer prerequisites
        shell: powershell
        run: ./scripts/setup-dev.ps1 -CheckOnly
      - name: Build public portable package
        shell: powershell
        run: ./scripts/build.ps1 -Package
      - name: Verify official components and entry point
        shell: pwsh
        run: |
          & './猛人下载器.exe' --check
          if ($LASTEXITCODE -ne 0) { throw 'Component verification failed' }
      - name: Site integration regression tests
        shell: pwsh
        run: |
          & ./node.exe --test tests/sites.test.mjs tests/session.test.mjs tests/capture.test.mjs tests/capture-menu.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Site tests failed' }
      - name: Build complete test package
        shell: powershell
        run: ./scripts/build.ps1 -Package -FullPackage
      - uses: actions/upload-artifact@v4
        with:
          name: mengren-downloader-windows-x64
          path: dist/*
